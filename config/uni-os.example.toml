[[courses]]
id = "la"
name = "Linear Algebra"
short = "LA"
folder = "LA"
slug = "la"
colour = "#8839ef"
colour_light = "#b58af5"
language = "English"
lecturers = []
lecture_slots = ["Mon 13:15-15:00", "Fri 10:15-12:00"]
exercise_slots = ["Thu 16:15-18:00"]
sheet_release = "Fri 18:00"
sheet_due = "Mon 09:00"
official_subfolders = ["LA assignments", "LA plan & notes"]
