# Example config for the fictional student Alex Example (Example Institute of Technology).
# examples/example-vault/ is the output of:
#   python tools/uni_os.py init --config examples/alex.toml --vault examples/example-vault --date 2026-11-07
# plus an empty .gitkeep in each empty folder (git keeps no empty folders); its
# _agent/uni-os.toml is a copy of this file.
# Every key is explained in config/uni-os.example.toml (the same values, with comments) and
# config/schema.md. This file lists every key, also those of modules Alex does not enable
# (keys of disabled modules are simply unused), except four old stuck-note aliases that
# config/schema.md documents for old configs.
#
# Modules: the Standard preset plus inbox-sync and experiments, so the example vault
# shows most of the system. Left out on purpose: vm, vault-watch and course-files-fetch
# (they need real infrastructure: an always-on host, Windows Task Scheduler, a logged-in
# browser). Enable them in your own vault with `uni-os enable <id>`.

[uni_os]
version = "0.1.0"
preset = "custom"

[student]
name = "Alex Example"
handle = "alex"
language = "English"
dictates = false
pronouns = ""

[university]
name = "Example Institute of Technology"
short = "EIT"
programme = "BSc Computer Science"
lms = "Moodle"
lms_url = "https://lms.example.edu"
website = "https://www.example.edu"
catalogue = ""
recordings = ""

[term]
label = "Autumn 2026"
timezone = "Europe/Zurich"
week0_monday = 2026-09-14
last_lecture_day = 2026-12-18
lecture_free_from = 2026-12-19
exam_session_start = 2027-01-25
exam_session_end = 2027-02-19
holidays = [
  { name = "Reading day", from = 2026-11-20, to = 2026-11-20 },
]

[paths]
vault = "G:/My Drive/Uni-EIT"
agent_dir = "_agent"
inbox = "inbox"
never_open = ["**/private/**"]
handwriting_app_data = ""
handwriting_app_exports = ""

[storage]
provider = "google-drive"

[obsidian]
enabled = true

[obsidian.area_colours]
me = "#F6BF26"
progress = "#00BCD4"
semester = "#795548"
deadline = "#EF6C00"
agent = "#6E7681"
course = "#607D8B"

[agent]
primary = "claude-code"
permission_posture = "bypass"
default_model = ""
heavy_model = ""
reply_rules = [
  "Keep replies short; use a table when comparing options.",
  "Write dates as Ddd D Mon YYYY, e.g. Mon 26 Oct 2026.",
]
skills_dir = ".claude/skills"
coordinator_title = "Uni coordinator"
context_refresh_tokens = 300000
usage_stop_weekly_pct = 90
usage_pause_5h_pct = 90
max_helpers = 2
cli = "claude"
headless_command = ""

[study]
formats = ["html", "md"]
math = "katex"
chunk_words = 750
assistance_default = "hints-only"
personal_deadline_rule = "Sheets released in a week are done by that Sunday."
experiment_weeks = 2
handwriting_app = "GoodNotes"
target_column = "Personal target"
intuition_first = true
pdf_browser = "auto"

[study.error_logs]
retests = false
retest_items = 3
retest_minutes = 20

[study.exercise_help]
cold_minutes = 25
part_cap_minutes = 45
stuck_bug_minutes = 25
official_solutions_after_attempt = true

[study.rundowns]
skim_lead_hours = 1
recall_keys = false
skim_courses = ["dm"]

[study.quiz]
auto_mocks = false
prep_lead_days = 4

[[courses]]
id = "algo"
name = "Algorithms and Data Structures"
short = "AD"
folder = "AD"
slug = "ad"
colour = "#1e66f5"
colour_light = "#7aa2f7"
language = "English"
lecturers = []
lecture_slots = ["Tue 10:15-12:00", "Thu 10:15-12:00"]
exercise_slots = ["Wed 14:15-16:00"]
sheet_release = "Thu 12:00"
sheet_due = "Thu 23:59, one week later"
official_subfolders = ["AD assignments", "AD slides & script"]
error_log_streams = ["main"]
assistance = "hints-only"
notes = ["Written answers use the pseudocode conventions of the script."]
ects = "8"
exercise_group = "group 3"
lms_url = "https://lms.example.edu/course/algo"
website = "https://algo.example.edu"
platforms = ["online judge with hidden tests (programming tasks)"]
recordings = "recorded, usually online the next day"
hand_in = "LMS upload, one PDF per person"
session_rule = "The exercise session of week n discusses sheet n-1 and introduces sheet n."
