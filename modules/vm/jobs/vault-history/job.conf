# vault-history: hourly read-only snapshot of the vault's text notes into a local git repo on
# the host (~/vault-history). Never writes to the vault. Powers `uni-vm grep`, `uni-vm find`,
# `uni-vm history` and the /catch-up command. It may run on two hosts at once (it only reads).
# What it skips: paths.never_open (private folders), the note app's data folder, vm.history_exclude.
# On by default.
TITLE="Vault notes history (hourly)"
KIND="command"
COMMAND="vault-history"
SCHEDULE="*-*-* *:{{vm.history_minute}}:00"
TIMEOUT_MIN="20"
NEEDS_VAULT="no"
QUIET_OK="yes"
DRY_OK="yes"
AGENT_LOCK="none"
RUNTIME="vm"
DEFAULT_MODE="always"
