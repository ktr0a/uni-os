# vm-performance-verdict: is the host big enough for the role sessions plus the jobs? Once a
# week (schedule.vm_verdict), once at least 3 days of samples exist (PRECHECK). Judges enough /
# tight / upgrade from the health check's samples, prices bigger machines against the budget
# (cloud hosts), appends one block to the host's perf-verdicts.md (shown in
# _agent/vm/performance.md) and tells the coordinator. Pushes only on "upgrade".
TITLE="Host performance verdict"
KIND="agent"
SLOTS="{{schedule.vm_verdict.time}}"
DAYS="{{schedule.vm_verdict.day}}"
SESSION="print"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="30"
NEEDS_VAULT="yes"
PRECHECK='uni-vm perf --has-days 3'
AGENT_LOCK="shared"
RUNTIME="vm"
DEFAULT_MODE="always"
