# vm-health: the always-on host's self-check (`uni-vm health`), every few minutes.
# Repairs what can be repaired (vault mount, Remote Control server, dead role sessions), closes
# idle interactive job sessions, takes a performance sample, runs the outcome checks, pushes an
# alert at most every vm.alert_repeat_h hours per problem when something stays broken (and one
# "recovered"), and writes _agent/vm/status.md, performance.md and snapshot.json (the host is
# their only writer). Host-internal: no agent, no other vault writes. On by default.
TITLE="Host health check"
KIND="command"
COMMAND="uni-vm health"
SCHEDULE="*-*-* *:00/{{vm.health_every_min}}:00"
TIMEOUT_MIN="12"
NEEDS_VAULT="no"
QUIET_OK="yes"
AGENT_LOCK="none"
RUNTIME="vm"
DEFAULT_MODE="always"
