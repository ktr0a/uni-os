# Job "deadline-audit" (module planning). Rendered from the config; edit the config, not this file.
# A read-only docs-vs-calendar audit: every dated obligation in the notes against the calendars and the study
# blocks before it, written as one report semester/plans/deadline-audit-YYYY-MM-DD.md. Changes nothing else.
# Optional and off when installed. In the original system the audit was a one-off side session in week 7; its
# findings fed the heartbeat's checks. Usually you ask for it ("audit my deadlines": the Plan & progress role
# runs the same procedure in a session). Switched on, this job runs it once on its own before the exam phase:
# on term.last_lecture_day at schedule.day_start (no new config keys). Without a last lecture day it has no
# schedule and only runs when started by hand (VM: `uni-vm jobs run deadline-audit`). For more audits (e.g.
# monthly), ask Plan & progress: "audit my deadlines".
# PRECHECK runs with the vault as working directory: skip when today's report already exists,
# unless this job's failure flag exists (then the run clears it).
TITLE="Deadline audit"
KIND="agent"
COMMAND=""
SLOTS="08:00"
DAYS=""
DATES="2026-12-18"
SCHEDULE=""
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="45"
NEEDS_VAULT="yes"
PRECHECK='[ ! -e "semester/plans/deadline-audit-$(date +%F).md" ] || test -f "_agent/logs/flags/deadline-audit.md"'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="shared"
LOCK_WAIT_MIN="20"
LAPTOP_TASK="deadline-audit"
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="off"
