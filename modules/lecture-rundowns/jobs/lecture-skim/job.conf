# Job "lecture-skim" (module lecture-rundowns). Rendered from the config; edit the config, not this file.
# Writes a short skim page before the next lecture of each course in study.rundowns.skim_courses, from the
# course's real script only, ready study.rundowns.skim_lead_hours before the lecture starts. Headless; no push.
# Optional and off when installed: in the original system this job was built after a duty audit found that the
# "skim due before the lecture" promise in the rundown brief had no trigger, and it stayed staged until the
# student said yes. Switch it on per host (VM: `uni-vm jobs on lecture-skim`; laptop: see module scheduler-local).
# PRECHECK runs with the vault as working directory: skip without starting the agent when no course is chosen
# or outside the teaching weeks (week 0 Monday to the last lecture day, when that is set), unless this job's
# failure flag exists (then the run clears it). The teaching weeks are a PRECHECK and not DATES on purpose:
# a DATES range would stop every run after the last lecture day, and a flag left by the last run would stay.
TITLE="Lecture skim"
KIND="agent"
COMMAND=""
SLOTS="{{schedule.lecture_skim}}"
DAYS="{{schedule.lecture_skim_days}}"
DATES=""
SCHEDULE=""
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="30"
NEEDS_VAULT="yes"
PRECHECK='[ -n "{{study.rundowns.skim_courses}}" ] && [ ! "$(date +%F)" \< "{{term.week0_monday}}" ] && ( [ -z "{{term.last_lecture_day}}" ] || [ ! "$(date +%F)" \> "{{term.last_lecture_day}}" ] ) || test -f "{{paths.agent_dir}}/logs/flags/lecture-skim.md"'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="shared"
LOCK_WAIT_MIN="20"
LAPTOP_TASK="lecture-skim"
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="off"
