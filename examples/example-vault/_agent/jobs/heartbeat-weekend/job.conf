# Heartbeat, weekend rhythm: the same standing brief as the job "heartbeat", on other days
# and times (the original ran weekdays three times and Sundays twice, no Saturday because
# the weekly check-in covered it). Empty schedule.heartbeat_weekend = this job never fires.
TITLE="Heartbeat (weekend)"
KIND="agent"
COMMAND=""
SLOTS="09:00, 17:40"
DAYS="Sun"
DATES=""
SCHEDULE=""
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="15"
NEEDS_VAULT="yes"
PRECHECK='"${UNI_PYTHON:-python3}" "${UNI_OS_HOME:-$HOME/uni-os}/tools/uni_os.py" heartbeat precheck'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="exclusive"
LOCK_WAIT_MIN="10"
LAPTOP_TASK=""
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="off"
