# Small fictional config for the tools tests (Alex Example at the Example Institute of Technology).
# "@TOPIC_FILE@" is replaced by the tests with a path outside the test vault.

[uni_os]
version = "0.1.0"
preset = "custom"

[student]
name = "Alex Example"
handle = "alex"

[university]
name = "Example Institute of Technology"
short = "EIT"
programme = "BSc Computer Science"

[term]
label = "Autumn 2026"
timezone = "Europe/Zurich"
