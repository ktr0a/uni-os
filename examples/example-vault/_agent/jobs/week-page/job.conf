# Job "week-page" (module check-in). Rendered from the config; edit the config, not this file.
# An agent job, not a plain command: `uni-os new-week` renders the page skeleton deterministically,
# but filling "Due this week" with the real items (concrete dates, sheet numbers, release status,
# carry-overs), closing the old page and asking for the week plan needs judgment.
# Cheaper alternative (no agent, skeleton only; the planner or check-in fills the rows later):
#   KIND="command"
#   COMMAND='python3 "$UNI_OS_HOME/tools/uni_os.py" new-week --vault "$PWD" --close-previous'
# (new-week creates the week after today's; run it Fri-Sun. It never overwrites an existing page.)
# PRECHECK runs with the vault as working directory: skip after the last lecture day, unless this
# job's failure flag exists (then the run clears it at "End of teaching").
TITLE="Week page"
KIND="agent"
COMMAND=""
SLOTS="10:00"
DAYS="Sun"
DATES=""
SCHEDULE=""
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="45"
NEEDS_VAULT="yes"
PRECHECK='[ -z "2026-12-18" ] || [ ! "$(date +%F)" \> "2026-12-18" ] || test -f "_agent/logs/flags/week-page.md"'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="shared"
LOCK_WAIT_MIN="20"
LAPTOP_TASK="week-page"
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="off"
