# =====================================================================================
#  Uni OS configuration: the single source of truth for your study system
# =====================================================================================
#
#  This example is filled in for a fictional student, Alex Example, at the fictional
#  Example Institute of Technology (EIT). Copy it, replace the values, then run
#
#      python tools/uni_os.py init --config my-uni-os.toml --vault "G:/My Drive/Uni"
#
#  (or simply tell your agent "set me up": it interviews you and writes this file).
#  After setup the live copy is <vault>/_agent/uni-os.toml. Edit that one, then run
#  `uni-os render` (or ask your agent) to apply changes. `uni-os doctor` checks it.
#
#  Rules of this file
#  - TOML. Text in quotes. Dates as 2026-09-14 (bare) or "2026-09-14".
#  - Times are QUOTED 24-hour strings: "07:30" (bare 07:30 is not valid TOML).
#  - Days are "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun".
#  - SECRETS NEVER GO IN HERE (API keys, calendar feed addresses, the ntfy topic,
#    tokens). The vault syncs everywhere and every agent can read it. This file may
#    only hold *paths* to secret files outside the vault (see notify.ntfy_topic_file).
#  - Every key has a default. Keys you leave out take the default shown in
#    config/schema.md (or from the modules you enable). Only [student] name,
#    [university] name and [term] label/timezone/week0_monday are required.
#  - Nothing here is anchored on the original system's days and times: every schedule is
#    your choice. The values below are only an example.
#  - This file shows EVERY key, also those of optional modules. Lines under
#    "# -- <id> module --" belong to that module (its defaults, the original system's
#    values); keys of modules you do not enable are simply unused. Your own config
#    needs only the keys whose values differ from the defaults. Not shown: four old
#    stuck-note aliases kept for old configs (config/schema.md; leave them out and set
#    notify.inbox_stale_hours / notify.inbox_stale_hours_taps instead).
# =====================================================================================


[uni_os]
# Framework version this config was written for.
version = "0.1.0"
# Module preset you started from: "minimal" | "standard" | "full" | "custom".
# Used only when [modules] enabled is empty. See setup/presets.md.
preset = "standard"


[student]
name = "Alex Example"           # how agents address you and name the vault
handle = "alex"                  # optional short id, shown next to the name (start page, handbook, profile)
language = "English"             # the language agents write notes and replies in
# true if you often dictate messages (speech to text): agents then work out mangled
# words from context and ask only when a wrong guess would change something.
dictates = false
pronouns = ""                    # optional, e.g. "she/her"


[university]
name = "Example Institute of Technology"
short = "EIT"
programme = "BSc Computer Science"
lms = "Moodle"                           # your learning platform (Moodle, Canvas, ...)
lms_url = "https://lms.example.edu"       # public start page only; never a private link
website = "https://www.example.edu"

# -- courses module --
# course catalogue URL (official list of courses, rooms, exam modes)
catalogue = ""
recordings = ""                              # lecture recording portal URL, if any


[term]
label = "Autumn 2026"                    # shown in titles ("EIT Autumn 2026")
timezone = "Europe/Zurich"               # IANA zone; "today" is computed here, also on a UTC server
# Week 0 is the Monday of the first lecture week; week n starts week0 + 7n days.
week0_monday = 2026-09-14
last_lecture_day = 2026-12-18
lecture_free_from = 2026-12-19
exam_session_start = 2027-01-25          # exam-session dates, used for exam-phase scheduling
exam_session_end = 2027-02-19
# Holidays and breaks inside the term (planning skips them, week pages mention them).
holidays = [
  { name = "Reading day", from = 2026-11-20, to = 2026-11-20 },
]


[paths]
# Where the vault lives on the laptop, e.g. "G:/My Drive/Uni" with Google Drive for
# desktop. Informational for agents and laptop scripts; the CLI always takes the
# vault from --vault or from the folder you run it in.
vault = "G:/My Drive/Uni-EIT"
agent_dir = "_agent"                     # the agent area; changing it is not recommended
inbox = "inbox"                          # drop folder for unsorted files and update notes
# Vault-relative globs that tools never open (doctor's secrets scan skips them; agents
# are told never to read them). Default: any folder named "private".
never_open = ["**/private/**"]

# -- handwritten-notes module --
# the note app's own sync/data folder if it lives inside the vault: never touched, never
# read, never listed
handwriting_app_data = ""
# the note app's own export folder inside the vault (notebooks not mapped to a course,
# fallback exports)
handwriting_app_exports = ""


[storage]
# Where the vault syncs: "google-drive" (documented default) | "onedrive" | "dropbox"
# | "icloud" | "syncthing" | "git" | "local". See docs/storage.md.
provider = "google-drive"


[obsidian]
# Obsidian is recommended, not required: everything is plain Markdown. Without it the
# dashboards (Bases views, Home, the cockpit plugin) are hard to get.
enabled = true

[obsidian.area_colours]
# Colours of the non-course areas (callouts, graph and canvas groups); keep them distinct.
# colour of the student-model area (me/): callout, graph group, canvas group
me = "#F6BF26"
progress = "#00BCD4"                         # colour of progress/ and the week pages
semester = "#795548"                         # colour of semester/ (dates, planning)
deadline = "#EF6C00"                         # colour of deadline callouts
agent = "#6E7681"                            # colour of the agent area (_agent/), muted
# colour of the neutral [!course] callout and the canvas Courses group
course = "#607D8B"


[agent]
# The agent you use: "claude-code" (the only one tested) | "codex" | "gemini-cli"
# | "cursor" | "other". See docs/agents.md.
primary = "claude-code"
# How much the agent may do without asking, for unattended jobs and role sessions:
# "bypass" (everything; only on a machine you trust, e.g. the VM) | "accept-edits" | "ask".
permission_posture = "bypass"
default_model = ""                       # empty = your agent's default
heavy_model = ""                         # for long or hard jobs; empty = default
# Personal reply rules every agent follows (written into _agent/rules.md).
reply_rules = [
  "Keep replies short; use a table when comparing options.",
  "Write dates as Ddd D Mon YYYY, e.g. Mon 26 Oct 2026.",
]
# Where your agent reads skills. Setup COPIES _agent/skills/* there (a copy, not a link:
# Google Drive has no symbolic links); copy them again after every `uni-os render`.
# In Claude Code: ".claude/skills" (project, inside the vault) or "~/.claude/skills" (user).
skills_dir = ".claude/skills"

# -- roles module --
coordinator_title = "Uni coordinator"        # session title of the coordinator, your single entry point
context_refresh_tokens = 300000              # recycle a long-lived session past about this many tokens
# unattended side sessions finish the current file, write their handover and stop at
# this percentage of the weekly usage limit
usage_stop_weekly_pct = 90
# unattended side sessions pause at this percentage of the plan's 5-hour usage limit
# until it resets
usage_pause_5h_pct = 90
max_helpers = 2                              # helper agents (subagents) a session may run at the same time
# -- scheduler-local module --
# agent command line used for headless job runs on the laptop (run_job.py)
cli = "claude"
# other agents: headless command template; "" = built-in Claude Code command
headless_command = ""


[study]
# Output formats for study pages: subset of "html" (interactive, KaTeX, quizzes),
# "md" (reads in Obsidian), "pdf" (print/tablet). The original used ["html", "md"]:
# an HTML page plus a Markdown twin. Markdown only if you mostly read in Obsidian.
formats = ["html", "md"]
math = "katex"                           # "katex" | "mathjax" | "none"
chunk_words = 750                        # words per study-page section (700-800 worked well)
# Default assistance level for graded work: "solo" (no help at all) | "hints-only" (smallest
# hint first, never a solution) | "coach" (explain, check your reasoning) | "full".
assistance_default = "hints-only"
# Your own rule that is stricter than official deadlines (planning and week pages use it).
personal_deadline_rule = "Sheets released in a week are done by that Sunday."

# -- experiments module --
experiment_weeks = 2                         # default length of a study or habit experiment (weeks)
# -- handwritten-notes module --
# name of your handwriting app, shown in the rules (e.g. "GoodNotes", "Notability")
handwriting_app = "GoodNotes"
# -- progress module --
# header of the personal-target column of every "Due this week" table (readers find it
# by the word "target"; the original: "Sunday target")
target_column = "Personal target"
# -- study-pages module --
# study pages and rundowns lead with intuition and pictures, then the precise
# definitions
intuition_first = true
pdf_browser = "auto"                         # "auto" | "chrome" | "edge" | "chromium" | a path

[study.error_logs]
# Error logs (module error-logs): optional cold-redo retest bank.
# turn on the optional cold-redo retest bank (the original student dropped it)
retests = false
retest_items = 3                             # items per course per weekly retest slot
retest_minutes = 20                          # length of the weekly retest slot (minutes)

[study.exercise_help]
# Exercise help (module exercise-help): hints-only pacing.
cold_minutes = 25                            # cold attempt before the first hint (minutes)
# cap per task part; then the missing idea in one line and move on (minutes)
part_cap_minutes = 45
# programming: stuck longer than this on one bug = ask for the next hint (minutes)
stuck_bug_minutes = 25
# ungraded tasks only: point to the official solution on explicit request after your own
# attempt (false = never)
official_solutions_after_attempt = true

[study.rundowns]
# Lecture rundowns (module lecture-rundowns).
# a skim is ready at least this many hours before the lecture starts
skim_lead_hours = 1
# offer post-lecture recall-key pages (the original student dropped recall tests)
recall_keys = false
# course ids the lecture-skim job writes skims for, e.g. ["dm"] (the original: only its
# hardest course)
skim_courses = ["dm"]

[study.quiz]
# Quiz coaching (module quiz-coaching).
# build a mock quiz with every prep sheet (false = mocks on request only)
auto_mocks = false
# the quiz-prep job builds sheets for quizzes within this many days
prep_lead_days = 4


# -------------------------------------------------------------------------------------
#  Courses: one [[courses]] block each. Folder names may contain spaces and "&".
#  Assessments describe graded work (for the progress tracker and integrity rules);
#  bonus describes how extra credit works (agents read the free-text rule).
# -------------------------------------------------------------------------------------

[[courses]]
id = "algo"                              # stable id (lowercase); used in tags, lookups and lists of course ids
name = "Algorithms and Data Structures"
short = "AD"                             # short label in tables and calendar titles
folder = "AD"                            # vault folder (e.g. "A&D" works too)
slug = "ad"                              # file prefix: ad.md, ad-error-log.md, ...
colour = "#1e66f5"                       # lecture colour (hex); Obsidian CSS, cockpit, canvas
colour_light = "#7aa2f7"                 # exercise colour; optional (computed if empty)
language = "English"                     # language of the course material
lecturers = []                           # optional; never put real names in shared examples
lecture_slots = ["Tue 10:15-12:00", "Thu 10:15-12:00"]   # "Ddd HH:MM-HH:MM"
exercise_slots = ["Wed 14:15-16:00"]
sheet_release = "Thu 12:00"              # when exercise sheets come out ("Ddd HH:MM")
sheet_due = "Thu 23:59, one week later"  # when they are due
# folders for official files (never renamed); `uni-os init` creates them empty inside the course folder
official_subfolders = ["AD assignments", "AD slides & script"]
error_log_streams = ["main"]             # one error log per stream
assistance = "hints-only"
notes = ["Written answers use the pseudocode conventions of the script."]

# Course facts (courses module): the course-facts skill and the course card read them. All optional.
ects = "8"
exercise_group = "group 3"                # your own exercise group / tutorial
lms_url = "https://lms.example.edu/course/algo"   # the course's public LMS page
website = "https://algo.example.edu"      # course website outside the LMS, if any
platforms = ["online judge with hidden tests (programming tasks)"]
recordings = "recorded, usually online the next day"
hand_in = "LMS upload, one PDF per person"
# THE key fact for planning: what the exercise session of term week n covers.
session_rule = "The exercise session of week n discusses sheet n-1 and introduces sheet n."
week_numbering = "Sheet k is released in term week k."   # course numbering vs term weeks
real_source = "the lecture script and the slides on the LMS"   # ground truth for "what was lectured"
page_offsets = [{ source = "Script 2026 (PDF)", rule = "PDF page = printed page + 2" }]
exam_format = "written, 120 min, English, one handwritten A4 sheet allowed"   # logistics, for exam-phase scheduling
integrity = "Sheets are individual work; AI may explain concepts, never produce solutions."
handwritten_folder = ""                   # "" = "AD handwritten" (handwritten-notes module; init creates it)
# Cockpit: extra names and an optional regular expression that identify this course.
aliases = ["Algo"]
detect = ""
# course-files-fetch: extra official pages (their hosts become allowed); vault-watch: extra note subfolders.
fetch_sources = []
watch_note_subfolders = []

  [[courses.assessments]]
  name = "Weekly exercise sheets"
  kind = "sheet"                         # sheet | quiz | oral | project | midterm | other
  schedule = "out Thu, due the next Thu 23:59"
  counts_for = "bonus"                   # bonus | grade | admission | none
  assistance = "hints-only"
  points_max = 0                         # 0 = unknown / varies

  [[courses.assessments]]
  name = "In-class quizzes"
  kind = "quiz"
  schedule = "weeks 4, 8 and 12, in the exercise session"
  counts_for = "bonus"
  # The attempt is always the student's own; hints-only allows prep sheets and a review
  # afterwards. "solo" would mean the coach prepares nothing aimed at the quiz.
  assistance = "hints-only"
  points_max = 10
  # dated sittings (cockpit: "N quizzes left"): "YYYY-MM-DD" or "YYYY-MM-DD HH:MM"
  dates = ["2026-10-14 14:15", "2026-11-11 14:15", "2026-12-09 14:15"]

  [courses.bonus]
  scheme = "threshold"                   # none | threshold | points | best-n | custom
  description = "+0.25 grade bonus at 80 % of all sheet points"
  max_bonus = 0.25
  rule = "Sum of sheet points over the term; quizzes count double."
  target = "80 % of all sheet points"     # short text for the course card
  # bonus rule engine (cockpit, progress):
  threshold = 0.8                        # threshold: share of all points for the full bonus
  total = 0                              # total points if published (0 = unknown)
  total_estimated = false                # true if total is your own estimate
  proportional = true                    # proportional share below the mark
  full_at = 0                            # points scheme only
  required = 0                           # best-n scheme only
  unit = "points"
  counts = []                            # assessments whose dates count as sittings ([] = all bonus ones)

[[courses]]
id = "dm"
name = "Discrete Mathematics"
