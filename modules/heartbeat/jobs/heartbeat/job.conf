# Heartbeat: the proactive watcher. A headless agent run behind a deterministic pre-check
# (`uni-os heartbeat precheck`, no agent, about a second): the agent only starts when
# something fired since the last run, so most slots cost nothing.
# Weekday rhythm here; the weekend rhythm is the job heartbeat-weekend (same brief).
# Never next to another agent job: AGENT_LOCK=exclusive waits up to LOCK_WAIT_MIN for the
# others to finish, else skips this slot; while it runs, ordinary jobs wait for it.
# Acting mode, thresholds and the ask mode live in [heartbeat] of _agent/uni-os.toml.
# New installs start switched off (DEFAULT_MODE="off"): switch it on only after a dry run
# and the student's yes (see the heartbeat README, "Switching it on").
TITLE="Heartbeat"
KIND="agent"
COMMAND=""
SLOTS="{{schedule.heartbeat}}"
DAYS="{{schedule.heartbeat_days}}"
DATES=""
SCHEDULE=""
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="15"
NEEDS_VAULT="yes"
PRECHECK='"${UNI_PYTHON:-python3}" "${UNI_OS_HOME:-$HOME/uni-os}/tools/uni_os.py" heartbeat precheck'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="exclusive"
LOCK_WAIT_MIN="10"
LAPTOP_TASK=""
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="off"
