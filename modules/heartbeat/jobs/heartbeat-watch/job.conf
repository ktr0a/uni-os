# Heartbeat event wake-ups, no agent. Every 10 minutes `uni-os heartbeat watch` checks
# whether something urgent fired since the last heartbeat run (a new red finding, a new
# outcome-check problem, a due item crossing 6 h before a deadline that falls before the
# next slot, a vault-watch conflict or deletion) and, if so, starts one extra heartbeat run
# through the host's job start command (heartbeat.start_job_command, else the runner's
# UNI_JOB_START, else the always-on host's systemd unit). Held: outside heartbeat.event_hours, inside a quiet
# window, after heartbeat.event_cap event runs today, when the next slot is near, or when
# the last run was under heartbeat.event_min_gap_min ago. Does nothing while the heartbeat
# job is switched off. Needs a host that can start a job on demand (the VM module), so it
# is meant for the always-on host; on a laptop the fixed slots are enough.
TITLE="Heartbeat event check"
KIND="command"
COMMAND='"${UNI_PYTHON:-python3}" "${UNI_OS_HOME:-$HOME/uni-os}/tools/uni_os.py" heartbeat watch'
SLOTS=""
EVERY_MIN="10"
DAYS="Mon,Tue,Wed,Thu,Fri,Sat,Sun"
DATES=""
SCHEDULE="*-*-* *:00/10:00"
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="3"
NEEDS_VAULT="yes"
PRECHECK=""
QUIET_OK="yes"
DRY_OK="yes"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="none"
LOCK_WAIT_MIN="20"
LAPTOP_TASK=""
FAILOVER_DELAY_MIN="25"
MARKER="no"
RUNTIME="vm"
DEFAULT_MODE="off"
