# Job inbox-sync (module inbox-sync): apply the update notes that create-only writers
# leave in the inbox, file them to _agent/inbox-applied/YYYY-MM/, forward "## For <session>"
# sections, log to _agent/logs/inbox-sync-log.md. The fixed slots are the safety net; the
# command job inbox-poll starts a run soon after a new note lands (at most hourly).
# Original: a mid-size model (Sonnet) at high effort, 45 min timeout, headless.
TITLE="Inbox sync (apply update notes)"
KIND="agent"
COMMAND=""
SLOTS="07:15, 13:15, 18:15"
DAYS="Mon,Tue,Wed,Thu,Fri,Sat,Sun"
DATES=""
SCHEDULE=""
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="45"
NEEDS_VAULT="yes"
# Skip the agent when no update note waits (the main cost saver). Runs from the vault root.
# If the inbox can't be listed at all, run anyway so the agent reports the problem; if an earlier
# run left its failure flag, run so a successful run can clear it.
PRECHECK='! ls "inbox" >/dev/null 2>&1 || compgen -G "inbox/*-update.md" >/dev/null || test -f "_agent/logs/flags/inbox-sync.md"'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="shared"
LOCK_WAIT_MIN="20"
LAPTOP_TASK="inbox-sync"
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="always"
