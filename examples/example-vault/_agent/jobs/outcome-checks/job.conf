# Outcome checks: "exit 0 says a job ended, not that its result is there."
# Deterministic result checks, no agent (`uni-os heartbeat outcomes --push`): tomorrow's prep
# note exists after the last prep run, today's after the morning check, no update note waits
# in the inbox for hours, no prep gap stays open for over a day. Fresh problems go through
# the push gate (shared budget, same ids as the heartbeat's flags, so the student never gets
# the same problem twice); a problem found during quiet time is simply found again on a
# later run. Each run first releases host alerts held during a quiet window (`push --flush`).
# Installed switched on (DEFAULT_MODE="always"), as in the original, where these checks ran
# every 15 minutes long before the heartbeat existed: they only ever push problems.
# Laptop: an OS scheduler task repeating every EVERY_MIN minutes (scheduler-local, path 2;
# an agent app's scheduled tasks can't run commands). Always-on host: the SCHEDULE line; it
# arrives switched off there (RUNTIME="any"), and while its timer is off the host's own built-in
# check in `uni-vm health` does the same work; `uni-vm jobs on outcome-checks` hands it over.
# ONE sender: with the vm module on, only the host pushes (this job run anywhere else prints
# its OUTCOME lines and sends nothing); without it, this job on the laptop, else the heartbeat.
# Ids and texts are shared with every other implementation (heartbeat_rules.py); the stuck-note
# threshold is notify.inbox_stale_hours / notify.inbox_stale_hours_taps.
# Off switch without editing this file: create the file "outcomes-off" in the heartbeat state
# folder (`uni-os heartbeat state --json` prints where), or switch the job off.
# `"${UNI_PYTHON:-python3}" "${UNI_OS_HOME:-$HOME/uni-os}/tools/uni_os.py"` is the uni-os
# command line; both job runners export UNI_OS_HOME (and the laptop runner UNI_PYTHON).
TITLE="Outcome checks"
KIND="command"
COMMAND='"${UNI_PYTHON:-python3}" "${UNI_OS_HOME:-$HOME/uni-os}/tools/uni_os.py" heartbeat outcomes --push'
SLOTS=""
EVERY_MIN="15"
DAYS="Mon,Tue,Wed,Thu,Fri,Sat,Sun"
DATES=""
SCHEDULE="*-*-* *:00/15:00"
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="3"
NEEDS_VAULT="yes"
PRECHECK=""
QUIET_OK="yes"
DRY_OK="yes"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="none"
LOCK_WAIT_MIN="20"
LAPTOP_TASK=""
FAILOVER_DELAY_MIN="25"
MARKER="no"
RUNTIME="any"
DEFAULT_MODE="always"
