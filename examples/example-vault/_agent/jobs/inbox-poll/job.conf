# Job inbox-poll (module inbox-sync): every few minutes inside the poll window, list the inbox
# and start the job inbox-sync when a NEW update note waits, at most once per min-gap
# (the fixed inbox-sync runs count too). No agent here. Done taps never start a sync
# (they wait for the next run). A note it already started a sync for (a parked one, say)
# doesn't start another: the fixed runs retry those. It also prints an OUTCOME line into its
# run log for every note that waited at least notify.inbox_stale_hours ("exit 0 is not
# success"). The PUSH for a stuck note has ONE sender, id inbox:stuck:<slug of the file name>:
# the always-on host with the vm module, else the outcome-checks job of module notifications
# (or the heartbeat). Adding --push to COMMAND only matters in a setup with neither module:
# the script reads the vault config and stands down whenever one of them is enabled.
#
# Host contract: the runner runs COMMAND with bash from the vault root and exports
#   UNI_OS_HOME    the framework clone (default below: $HOME/uni-os)
#   UNI_PYTHON     the Python 3.11+ interpreter (default: python3)
#   UNI_JOB_START  command that starts a job, "{job}" is replaced by the job id
#                  (default in the script: systemctl --user start --no-block uni-job@{job}.service)
#   UNI_STATE_DIR  host-side state folder (default: ~/.local/state/uni-os); the runner keeps
#                  per-job run logs in $UNI_STATE_DIR/jobs/<job>/*.log
# Undo: switch the job off; the fixed inbox-sync runs stay as the safety net.
TITLE="Inbox poll: start the sync when a note waits"
KIND="command"
COMMAND='"${UNI_PYTHON:-python3}" "${UNI_OS_HOME:-$HOME/uni-os}/modules/inbox-sync/scripts/inbox_poll.py" poll --vault . --inbox "inbox" --job inbox-sync --window "07:00-22:00" --min-gap-min "60" --stale-hours "4" --tap-stale-hours "14"'
SLOTS=""
# Portable interval for laptop schedulers (scheduler-local reads it); SCHEDULE is the
# same interval in systemd OnCalendar form for the always-on host. The script itself
# enforces the poll window, so the timer may fire around the clock.
EVERY_MIN="10"
DAYS="Mon,Tue,Wed,Thu,Fri,Sat,Sun"
DATES=""
SCHEDULE="*-*-* *:00/10:00"
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="2"
NEEDS_VAULT="yes"
PRECHECK=""
QUIET_OK="yes"
DRY_OK="yes"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="none"
LOCK_WAIT_MIN="20"
LAPTOP_TASK=""
FAILOVER_DELAY_MIN="25"
MARKER="no"
RUNTIME="any"
DEFAULT_MODE="always"
