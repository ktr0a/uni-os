# Example %USERPROFILE%\.wslconfig for the Uni OS home server (Windows side of WSL2).
# Size memory after measuring: Windows itself needs ~1.5-2.5 GB (more with Chrome and the agent's
# desktop app running), WSL's own overhead is ~0.3-0.5 GB. An 8 GB laptop whose iGPU reserves 2 GB
# left ~5.9 GB for Windows in the original setup, so Linux got 3.5 GB.
# After a change: wsl --shutdown (ends every session in WSL!), the keep-alive task starts it again.
[wsl2]
memory=3584MB
swap=4GB
swapFile=C:\\WSL\\swap.vhdx
# never shut the WSL VM down when idle: jobs and sessions run with nobody attached
vmIdleTimeout=-1
guiApplications=false

[experimental]
# give freed Linux page cache back to Windows over time instead of holding it
autoMemoryReclaim=gradual
sparseVhd=true

[general]
# keep the distro running with no wsl.exe attached (WSL 2.x; the keep-alive task is the fallback)
instanceIdleTimeout=-1
