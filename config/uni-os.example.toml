  points_max = 4

  [[courses.assessments]]
  name = "Exercise sheets"
  kind = "sheet"
  schedule = "weekly, discussed in the exercise session"
  counts_for = "none"
  assistance = "hints-only"

  [courses.bonus]
  scheme = "best-n"
  description = "Pass 10 of the 12 online quizzes (70 % each) for +0.25"
  max_bonus = 0.25
  rule = "At least 10 of the 12 weekly quizzes passed with >= 70 %; fewer passes give a proportional share."
  target = "10 / 12"
  required = 10                          # best-n scheme: how many must be passed
