# The heartbeat's one combined question (session ask mode). Never on a timer (no SLOTS):
# `uni-os heartbeat ask` queues the question in the heartbeat state folder and starts this
# job through the host's job start command (on the always-on host: its systemd unit).
# It runs after the heartbeat run ends (the
# heartbeat holds the exclusive agent lock), opens an interactive session the student can
# answer from the phone, and the runner pushes the session link through the push gate with
# the id below (one id for every question, so the gate allows at most one question a day).
# The runner's done-push needs `uni-os push --id "$NOTIFY_GATE" --text "$NOTIFY_DONE" --click <link> --urgent`.
# Without an always-on host the heartbeat asks inline instead (the question is the push).
TITLE="Heartbeat question"
KIND="agent"
COMMAND=""
SLOTS=""
DAYS="Mon,Tue,Wed,Thu,Fri,Sat,Sun"
DATES=""
SCHEDULE=""
SESSION="rc"
KEEP_H="6"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="10"
NEEDS_VAULT="yes"
PRECHECK='"${UNI_PYTHON:-python3}" "${UNI_OS_HOME:-$HOME/uni-os}/tools/uni_os.py" heartbeat ask --has-pending'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE="Your study system has one question for you. Tap to answer."
NOTIFY_GATE="heartbeat-ask"
AGENT_LOCK="shared"
LOCK_WAIT_MIN="20"
LAPTOP_TASK=""
FAILOVER_DELAY_MIN="25"
MARKER="no"
RUNTIME="vm"
DEFAULT_MODE="always"
