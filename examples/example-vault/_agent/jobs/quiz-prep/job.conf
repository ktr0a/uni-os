# Job "quiz-prep" (module quiz-coaching). Rendered from the config; edit the config, not this file.
# Builds the prep sheet (and, where the course wants one, a timed mock) for the next graded quiz of each course,
# a few days before it. Headless; no push: the daily prep picks the page up, and a missing page shows as a prep gap.
# Optional and off when installed. In the original system this job ran on three fixed dates (a few days before
# each remaining written quiz of one course), because nothing else triggered the prep page and role sessions
# only act when spoken to. Generalised: it runs only on the dates in schedule.quiz_prep_dates (";"-separated
# "YYYY-MM-DD", written by the setup agent or the quiz coach from the quiz schedule) at schedule.quiz_prep.
# PRECHECK runs with the vault as working directory: skip without starting the agent when no date is set,
# unless this job's failure flag exists (then the run clears it).
TITLE="Quiz prep page"
KIND="agent"
COMMAND=""
SLOTS="09:00"
DAYS=""
DATES=""
SCHEDULE=""
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="60"
NEEDS_VAULT="yes"
PRECHECK='[ -n "" ] || test -f "_agent/logs/flags/quiz-prep.md"'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="shared"
LOCK_WAIT_MIN="20"
LAPTOP_TASK="quiz-prep"
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="off"
