# Job "waiting-on-you" (module roles). Rendered from the config; edit the config, not this file.
# Writes ONE page for the student, `waiting-on-you.md` at the vault root: everything that waits on them
# (decisions only they can make, physical steps at the laptop, results only they know, settings to confirm),
# grouped by when, each item with its state, numbered micro-steps, the time it needs and a link to the details.
# Then at most ONE push that points to the page, through the push gate: many small pings become one page
# (the "batch interventions" rule). No push when nothing is due soon (silence is the norm).
# Optional and off when installed. In the original system the coordinator wrote such a page by hand in the
# morning for an evening reminder; here it is a job at schedule.waiting_on_you on schedule.waiting_on_you_days
# (the original's evening time is only the default). Release it like any new job: dry run first, then the
# student's yes (module scheduler-local or vm, "Releasing a new agent job").
# PRECHECK runs with the vault as working directory: skip without starting the agent when there is no
# coordinator state page (the main source) to read.
TITLE="What's waiting on you"
KIND="agent"
COMMAND=""
SLOTS="19:00"
DAYS="Mon, Tue, Wed, Thu, Fri, Sat, Sun"
DATES=""
SCHEDULE=""
SESSION="print"
KEEP_H="8"
MODEL=""
EFFORT="medium"
TIMEOUT_MIN="20"
NEEDS_VAULT="yes"
PRECHECK='test -f "_agent/coordinator-state.md"'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE=""
NOTIFY_GATE=""
AGENT_LOCK="shared"
LOCK_WAIT_MIN="20"
LAPTOP_TASK="waiting-on-you"
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="off"
