# Job "check-in" (module check-in). Rendered from the config; edit the config, not this file.
# Interactive: turn 1 asks the student once for the period's results, turn 2 applies the answer.
# PRECHECK runs with the vault as working directory: skip unless some week page still waits for
# its check-in (marker "_To fill_"), and, with every = "2 weeks", unless the term week is odd;
# but always run while this job's failure flag exists (step 0 clears it once nothing is left to fill).
TITLE="Check-in"
KIND="agent"
COMMAND=""
SLOTS="{{schedule.check_in.time}}"
DAYS="{{schedule.check_in.day}}"
DATES=""
SCHEDULE=""
SESSION="rc"
KEEP_H="36"
MODEL=""
EFFORT="high"
TIMEOUT_MIN="45"
NEEDS_VAULT="yes"
PRECHECK='grep -qs "_To fill_" progress/weeks/week-*.md{{#if schedule.check_in.every == "2 weeks"}} && [ $(( ( $(date +%s) - $(date -d "{{term.week0_monday}}" +%s) ) / 604800 % 2 )) -eq 1 ]{{/if}} || test -f "{{paths.agent_dir}}/logs/flags/check-in.md"'
QUIET_OK="no"
DRY_OK="no"
NOTIFY_DONE="Check-in is waiting for your results. Tap to open the session."
NOTIFY_GATE=""
AGENT_LOCK="shared"
LOCK_WAIT_MIN="20"
LAPTOP_TASK="check-in"
FAILOVER_DELAY_MIN="25"
MARKER="yes"
RUNTIME="any"
DEFAULT_MODE="off"
