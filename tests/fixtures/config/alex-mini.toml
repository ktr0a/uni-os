  kind = "sheet"
  counts_for = "bonus"

  [[courses.assessments]]
  name = "Graded quiz"
  kind = "quiz"
  counts_for = "bonus"
  assistance = "solo"

  [courses.bonus]
  scheme = "threshold"
  max_bonus = 0.25

[[courses]]
id = "prog"
name = "Introduction to Programming"
short = "PROG"
folder = "PROG"
slug = "prog"
colour = "#d20f39"
